name: Scheduled publishing

# Scheduled publishing is build-time: a post with a `publish: YYYY-MM-DD` field
# is held out of the build until that date, then appears once a build runs (see
# scripts/build-index.mjs). So "publishing" is just a deploy on/after the date —
# this workflow NEVER writes to the repo (no commits, no PRs), which keeps main's
# branch protection intact. Each day it checks whether any post's date is today;
# if so it opens a cartoon-reminder issue for each and dispatches deploy.yml.
on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read # read posts to find today's; deploy.yml does the build
  issues: write # open cartoon-reminder issues
  actions: write # dispatch deploy.yml

concurrency:
  group: schedule-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find posts going live today
        run: node scripts/published-today.mjs

      - name: Count
        id: result
        run: echo "count=$(jq 'length' published.json)" >> "$GITHUB_OUTPUT"

      - name: Notify + deploy
        if: steps.result.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # One cartoon-reminder issue per post going live today.
          jq -c '.[]' published.json | while read -r post; do
            title=$(jq -r '.title' <<<"$post")
            path=$(jq -r '.path'  <<<"$post")
            slug=$(jq -r '.slug'  <<<"$post")
            side=$(jq -r '.side'  <<<"$post")
            body=$(printf '%s\n' \
              "Went live today on schedule without a cartoon yet." \
              "" \
              "Add at least one xkcd-style stick-figure cartoon per CLAUDE.md (§ Images & cartoons)." \
              "" \
              "- Post: \`$path\`" \
              "- Live: \`/$side/p/$slug/\`" \
              "- Drop art under \`assets/img/$slug/\`, referenced with a root-absolute \`/assets/...\` path.")
            gh issue create --title "🎨 Cartoon needed: $title" --body "$body"
          done

          # Rebuild + deploy so today's posts appear. build-index.mjs gates by
          # date at build time, so this deploy reveals every post now due. Any
          # deploy reveals all due posts, so a missed day self-heals next run.
          gh workflow run deploy.yml --ref main
