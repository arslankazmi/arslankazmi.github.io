name: Deploy to GitHub Pages

# A PR merge to main is a push to main — that triggers the build + deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts (don't cancel an in-flight publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # DejaVu (Sans/Serif/Mono) is what the OG social cards render with
      # (scripts/og-card.mjs). It's preinstalled on ubuntu-latest; ensure it so
      # the card fonts stay deterministic. Non-fatal — falls back if unavailable.
      - name: Ensure DejaVu fonts for social cards
        run: sudo apt-get install -y fonts-dejavu-core || echo "using available system fonts"
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
